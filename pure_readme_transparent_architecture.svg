<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 510" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .col-header { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .pill-text { font-family: monospace, system-ui; font-size: 9.5px; font-weight: 700; }
    .footer-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #34d399; letter-spacing: 0.5px; }

    /* Animated Wire Paths */
    .wire { fill: none; stroke: rgba(148, 163, 184, 0.25); stroke-width: 2; stroke-dasharray: 6 6; }
    .wire-active { fill: none; stroke: rgba(6, 182, 212, 0.5); stroke-width: 2.5; }

    /* Moving Glowing Particles */
    .part-cyan { fill: #06b6d4; filter: url(#glowCyan); }
    .part-purple { fill: #c084fc; filter: url(#glowPurple); }
    .part-green { fill: #34d399; filter: url(#glowGreen); }

    /* Card Border Sweeps */
    @keyframes borderSweep {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 450; }
    }
    .sweep-border {
      stroke-dasharray: 70 380;
      animation: borderSweep 6s linear infinite;
    }

    /* Pulsing Beacons */
    @keyframes pulseBeacon {
      0% { r: 4px; opacity: 1; }
      100% { r: 15px; opacity: 0; }
    }
    .beacon-pulse { animation: pulseBeacon 1.6s infinite ease-out; }
  </style>

  <!-- PURE TRANSPARENT ARCHITECTURE — ZERO RECT BACKGROUND -->

  <!-- COLUMN HEADERS -->
  <text x="120" y="25" text-anchor="middle" class="col-header" fill="#818cf8">1. INGESTION VECTORS</text>
  <text x="425" y="25" text-anchor="middle" class="col-header" fill="#38bdf8">2. CORE AI MATRIX &amp; TAX ENGINE</text>
  <text x="735" y="25" text-anchor="middle" class="col-header" fill="#c084fc">3. ENTERPRISE B2B VAULT</text>
  <text x="1035" y="25" text-anchor="middle" class="col-header" fill="#34d399">4. IMPACT &amp; REVENUE</text>

